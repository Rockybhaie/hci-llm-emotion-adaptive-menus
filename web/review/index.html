<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Answer review</title>
  <link rel="stylesheet" href="/shell/shell.css">
  <link rel="stylesheet" href="/portal/portal.css">
  <link rel="stylesheet" href="/genui/genui.css">
  <style>
    body { user-select: text; }
    .rv { max-width: 980px; margin: 0 auto; padding: 36px 24px 80px; }
    .rv h1 { font-size: 30px; margin-bottom: 4px; }
    .rv-note { color: var(--muted); margin-bottom: 20px; font-size: 15px; }
    .rv-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .rv-tab { height: 34px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font: inherit; font-size: 14px; color: var(--ink-2); }
    .rv-tab:hover { background: var(--surface-2); }
    .rv-tab.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    .rv-meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13.5px; color: var(--muted); margin: 10px 0 4px; }
    .rv-meta b { color: var(--ink); font-weight: 600; }
    .rv-quiz { margin-top: 18px; padding: 16px 18px; border-radius: 10px; background: var(--surface); border: 1px dashed var(--line-strong); font-size: 15px; }
    .rv-quiz ul { margin: 8px 0 0; padding-left: 20px; }
    .rv-quiz li.ok { font-weight: 600; color: var(--good); }
  </style>
</head>
<body>
  <div class="rv" id="rv"><div class="boot"><div class="spinner"></div></div></div>
  <script type="module">
    import { renderLook } from '/genui/render.js';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const data = await (await fetch('/api/review')).json();
    const root = document.getElementById('rv');
    const params = new URLSearchParams(location.search);
    let qi = Math.max(0, data.queries.findIndex((q) => q.id === params.get('q')));
    let look = params.get('look') || data.looks[0].id;

    function draw() {
      const q = data.queries[qi];
      const prov = q.provenance || {};
      root.innerHTML = `
        <h1>Answer review</h1>
        <p class="rv-note">Every answer in every look, exactly as participants see it. Nothing is recorded. When the team has
          checked a query, set <code>reviewed_by</code> and <code>status: reviewed</code> in <code>content/queries/${q.id}.yaml</code>.</p>
        <div class="rv-tabs">${data.queries.map((x, i) => `<button class="rv-tab ${i === qi ? 'on' : ''}" data-q="${i}">${esc(x.id)} · ${esc(x.subject || x.type)}</button>`).join('')}</div>
        <div class="pt-ask">${q.subject ? `<span class="pt-subject">${esc(q.subject)}</span>` : ''}<div class="pt-input">${esc(q.query)}</div></div>
        <div class="rv-meta"><span>Status <b>${esc(prov.status || '?')}</b></span><span>Generated by <b>${esc(prov.generated_by || '?')}</b></span>
          <span>Reviewed by <b>${esc(prov.reviewed_by || '—')}</b></span></div>
        <div class="rv-tabs">${data.looks.map((l) => `<button class="rv-tab ${l.id === look ? 'on' : ''}" data-look="${l.id}">${esc(l.label)}</button>`).join('')}</div>
        <div class="pt-answer"><div class="pt-answer-body" id="ans"></div></div>
        <div class="rv-quiz"><b>Quiz:</b> ${esc(q.quiz.question)}<ul>${q.quiz.options.map((o) => `<li class="${o === q.quiz.answer ? 'ok' : ''}">${esc(o)}${o === q.quiz.answer ? ' ✓' : ''}</li>`).join('')}</ul></div>`;
      root.querySelector('#ans').appendChild(renderLook(q.looks[look], look));
      root.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => { qi = +b.dataset.q; draw(); }));
      root.querySelectorAll('[data-look]').forEach((b) => b.addEventListener('click', () => { look = b.dataset.look; draw(); }));
      history.replaceState(null, '', `?q=${q.id}&look=${look}`);
    }
    draw();
  </script>
</body>
</html>
