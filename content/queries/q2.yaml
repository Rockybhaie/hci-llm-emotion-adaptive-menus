        - {title: Server, text: "The computer that stores the website"}
        - {title: HTTP(S), text: "The language for asking for and sending pages"}

  steps:
    - {type: heading, text: What happens in 5 steps}
    - type: steps
      items:
        - {title: You type the address, text: "For example **example.com**, and press Enter."}
        - {title: DNS lookup, text: "The browser asks a **DNS server** for the site's **IP address**, the number computers use to find each other."}
        - {title: Connect, text: "The browser connects to the server at that IP address. With **https** the connection is encrypted."}
        - {title: Request and response, text: "The browser asks for the page; the server replies with the **HTML** and a status code (200 = OK, 404 = not found)."}
        - {title: Render, text: "The browser fetches the images, CSS and scripts and **draws** the page."}

  example:
