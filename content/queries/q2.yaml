quiz:
  question: What does DNS do when you type a website address?
  options: [Finds the IP address of the website's server, Stores your passwords, Makes your Wi-Fi faster, Draws the page on your screen]
  answer: Finds the IP address of the website's server

looks:
  text:
    - {type: heading, text: From a web address to a web page}
    - {type: paragraph, text: "Computers on the internet find each other with numbers called **IP addresses** (for example 142.250.180.14), not with names like example.com. So the first thing your browser does is ask a **DNS server**, the internet's address book, which IP address belongs to that name."}
    - {type: paragraph, text: "With the IP address, the browser **connects** to the website's server. With https, the two also agree on a secret key so that nobody in between can read what they send."}
    - {type: paragraph, text: "The browser then sends a **request** (\"please send me this page\") and the server sends back a **response**: the page's HTML, plus a status code such as 200 (OK) or 404 (not found)."}
    - {type: paragraph, text: "Finally the browser **renders** the page. It reads the HTML, fetches the images, styles (CSS) and scripts it mentions, and draws everything on your screen. All of this usually takes less than a second."}

  visual:
