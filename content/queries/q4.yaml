    - {type: paragraph, text: "Two weeks is enough if you use them well. Start by **making a plan**: list your exams and dates, note which topics you feel weakest in, and give the most time to exams that are soon, heavily weighted or difficult for you."}
    - {type: paragraph, text: "When you study, **test yourself** instead of re-reading. Answer practice questions, explain topics from memory or use flashcards. Remembering something from memory makes it stick much better than reading it again."}
    - {type: paragraph, text: "**Spread your study out** over the days instead of cramming one subject at a time. Revisit each subject every two or three days and **mix** different topics in one session; it feels harder, but you remember more."}
    - {type: paragraph, text: "In the final days, do **past papers under timed conditions**. Keep the last day before an exam light, and **sleep 7–9 hours**; sleep is when your brain stores what you learned."}

