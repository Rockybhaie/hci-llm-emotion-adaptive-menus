        - [Swapping, "Moving data from full RAM to the drive (virtual memory / page file)"]
        - [The slowdown, Waiting for swapped data to come back from the drive]
        - [The fix, "Close unused apps and tabs, restart, or add more RAM"]
    - {type: callout, tone: tip, title: In one sentence, text: "Too many apps → RAM full → data pushed to the slow drive → waiting → lag."}

