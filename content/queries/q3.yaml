    - type: diagram
      kind: flow
      nodes: [Many apps open, RAM is full, Data moved to the drive, Switching apps waits for it, Computer feels slow]
    - {type: callout, tone: note, title: Reading the chart, text: "Once the blue line passes the 8 GB line (about 6 apps here), data starts moving to the slow drive."}

  steps:
    - {type: heading, text: How the slowdown happens}
    - type: steps
      items:
        - {title: Each app uses memory, text: "Every open app and browser tab keeps its data in **RAM**, the fast workspace."}
        - {title: RAM fills up, text: "With many apps open, together they need more memory than the laptop has."}
        - {title: Data is moved to the drive, text: "The computer moves less-used data to the **SSD or hard disk** (**swapping**)."}
        - {title: Waiting to bring it back, text: "When you switch to that app, its data must come back from the much slower drive."}
        - {title: You notice lag, text: "Apps freeze or respond slowly. Fix: **close unused apps and tabs**, restart, or add RAM."}

  example:
    - {type: heading, text: "Sara's 8 GB laptop during exam week"}
    - type: example
      title: "Adding up the memory"
      setup: "The system itself uses about 2 GB. Sara has a browser with 20 tabs open (about 4 GB), a video call (1.5 GB), a music app (0.5 GB) and a code editor (1.5 GB)."
      steps:
        - "Total needed: 2 + 4 + 1.5 + 0.5 + 1.5 = **9.5 GB**."
        - "Her laptop has **8 GB** of RAM, so 1.5 GB does not fit."
        - "That 1.5 GB is moved to the SSD. Switching back to the code editor now takes a few seconds."
        - "She closes 15 tabs she is not using: about **3 GB** freed, so the total is 6.5 GB."
      result: "Everything fits in RAM again (6.5 GB < 8 GB), and switching between apps is instant."

  summary:
    - {type: heading, text: Slowdown cheat sheet}
