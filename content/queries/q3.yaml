quiz:
  question: "When your computer's RAM is full, where does it move data, making everything slower?"
  options: [To the storage drive (SSD or hard disk), To the internet, To the graphics card, It deletes the data]
  answer: To the storage drive (SSD or hard disk)

looks:
  text:
    - {type: heading, text: Why too many apps slow your computer down}
    - {type: paragraph, text: "Apps that are open keep their data in **RAM** (memory), the computer's very fast short-term workspace. Every app and every browser tab takes some of it, and a typical laptop has only 8 or 16 GB."}
    - {type: paragraph, text: "When RAM is full, the computer does not stop. It moves data that has not been used for a while to the **storage drive** (SSD or hard disk). This is called **swapping** (or using virtual memory / the page file)."}
    - {type: paragraph, text: "The problem is that the drive is **much slower than RAM**. When you switch back to an app whose data was moved out, the computer first has to bring it back from the drive. That waiting is the lag and freezing you notice."}
    - {type: paragraph, text: "The fix is to keep RAM from filling up: close apps and tabs you are not using, restart now and then, or add more RAM."}

  visual:
