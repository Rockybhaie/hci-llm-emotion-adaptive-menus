# Session-wide settings. All durations are in seconds.
# `--fast` divides every duration by `fast_divisor` (for dry runs only).

study_title: Website Navigation Study     # shown to participants (deliberately neutral)

timings:
  baseline_rest: 180        # resting baseline
  induction: 180            # MIST, breathing, copying task
  task_timeout: 40          # max time per task (an emotion's in_task.timeout overrides it)
  practice_task_timeout: 120   # practice has no time pressure; this only prevents getting stuck
  washout: 150              # neutral clip between the two emotion blocks
  film_reflection: 30       # quiet pause after the sadness induction clip
  briefing_min_read: 12     # frustration briefing: Continue unlocks after this
  booster_min_read: 8       # frustration booster: Continue unlocks after this

session:
  tasks_per_subblock: 4     # 4 tasks per sub-block, one sub-block per menu
  practice_tasks_per_menu: 2

fast_divisor: 12

questionnaires:
  # Asked after every induction and every sub-block, always all six, so the
  # target emotion is never revealed. Order is shuffled per participant.
  emotion_items: [stressed, calm, frustrated, bored, happy, sad]
  emotion_scale: 7

server:
  host: 127.0.0.1
  port: 8765

browser: edge               # edge | chrome
