# Northfield University Student Portal (G1): six task subsets S1-S6 (one per emotion x menu cell) and a practice pool P.
#
# Every subset has the same four tasks in the same order: lookup, extreme, lookup, compare (a
# two-page compare; in G1 the two items may use different money fields). Subsets are assigned to
# cells by a 6 x 6 Latin square (hci/counterbalance.py). All target pages are 2 levels deep in every menu.
#   lookup : find a named item, answer a question about one field
#   extreme: find the item on a page with the max/min value of a field
#   compare: two items on different pages, pick the max/min (an item may name its own `field`)
# P is the practice pool: simple lookups on pages that no S1-S6 task targets. Menu i of the group
# practises on P[2i] and P[2i+1].
# Answers and answer options are computed from web/sites/<site>/site.json. In the boredom block the
# site's repetitive template replaces these (same target pages).

S1:
  - {id: S1-1, type: lookup, page: campus-life/dining, item: "Noodle Bar", field: Opening hours, question: "What are its opening hours?", text: "You want dinner at the Noodle Bar."}
  - {id: S1-2, type: extreme, page: academics/grades, field: Weight, mode: min, text: "Which assessment has the lowest weighting in your grade breakdown?"}
  - {id: S1-3, type: lookup, page: services/counselling, item: "Drop-in wellbeing chat", field: Availability, question: "When is it available?", text: "Find the drop-in wellbeing chat."}
  - {id: S1-4, type: compare, field: Fee, mode: max, items: [{page: registration/transcripts, item: "International transcript", field: Fee}, {page: finance/refunds, item: "Accommodation deposit", field: Amount}], text: "Which is more: the fee for an international transcript, or the accommodation deposit being refunded to you?"}

